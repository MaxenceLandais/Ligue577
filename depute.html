<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche Député - Observatoire du Libéralisme</title>
    <link rel="stylesheet" href="assets/style.css">

    <!-- Typographie Style Arcade / FUT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <!-- Balises Open Graph pour réseaux sociaux -->
    <meta property="og:type" content="profile">
    <meta id="og-title" property="og:title" content="Fiche Député - Observatoire du Libéralisme">
    <meta id="og-desc" property="og:description" content="Découvrez l'évaluation économique et le score de ce député sur les 6 piliers de la liberté économique.">
    <meta id="og-image" property="og:image" content="https://www.assemblee-nationale.fr/dyn/static/tribun/17/photos/PA841223.jpg">
    <meta id="og-url" property="og:url" content="">

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta id="tw-title" name="twitter:title" content="Fiche Député - Observatoire du Libéralisme">
    <meta id="tw-desc" name="twitter:description" content="Évaluation économique et score global sur les 6 piliers de la liberté économique.">
    <meta id="tw-image" name="twitter:image" content="https://www.assemblee-nationale.fr/dyn/static/tribun/17/photos/PA841223.jpg">

    <style>
        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 25px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        /* --- CARTE FIFA ULTIMATE TEAM (GRAND FORMAT) --- */
        .fut-card-large {
            width: 280px;
            background: linear-gradient(135deg, #fce08a 0%, #c59b27 50%, #e6c863 100%);
            border-radius: 18px;
            padding: 18px 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 2px solid #ffe89e;
            font-family: 'Rajdhani', sans-serif;
            color: #1e1e1e;
            text-transform: uppercase;
            user-select: none;
            flex-shrink: 0;
        }
        .fut-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .fut-badge {
            text-align: center;
            line-height: 0.9;
        }
        .fut-score-global {
            font-size: 48px;
            font-weight: 700;
        }
        .fut-groupe {
            font-size: 14px;
            font-weight: 700;
            color: #3a2e05;
            margin-top: 4px;
        }
        .fut-photo-container {
            width: 130px;
            height: 130px;
        }
        .fut-photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }
        .fut-nom {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin: 8px 0 6px 0;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.15);
            padding-bottom: 4px;
        }
        .fut-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
            padding: 4px 6px;
        }
        .fut-stat {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .fut-stat-val {
            font-size: 19px;
            font-weight: 700;
        }
        .fut-stat-lbl {
            font-size: 13px;
            color: #3a2e05;
            font-weight: 700;
        }

        .profile-info {
            flex: 1;
            min-width: 260px;
        }
        .profile-info h2 {
            margin: 0 0 6px 0;
            font-size: 1.8rem;
        }
        .profile-info p {
            margin: 4px 0;
            color: #64748b;
            font-size: 1.05rem;
        }
        .datan-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background-color: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
        }
        .datan-link:hover {
            background-color: #dbeafe;
        }

        /* Stats Datan */
        .stats-grid {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .stat-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            min-width: 130px;
        }
        .stat-value {
            font-size: 1.15rem;
            font-weight: bold;
            color: #1e293b;
        }
        .stat-label {
            font-size: 0.78rem;
            color: #64748b;
        }

        .social-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px;
            margin-top: 15px;
        }
        .social-total {
            font-size: 1.05rem;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 10px;
        }
        .social-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .social-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            text-decoration: none;
            color: #334155;
            font-size: 0.85rem;
            font-weight: 600;
            transition: border-color 0.2s, color 0.2s;
        }
        .social-badge:hover {
            border-color: #2563eb;
            color: #2563eb;
        }
        .pillar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 15px;
        }
        .pillar-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
        }
        .pillar-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: #334155;
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .progress-bar-bg {
            height: 10px;
            background-color: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.4s ease;
        }
        .initiative-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #2563eb;
            border-radius: 6px;
            padding: 14px 18px;
            margin-top: 12px;
        }
        .initiative-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .initiative-title {
            font-size: 1rem;
            font-weight: bold;
            color: #1e293b;
        }
        .initiative-meta {
            font-size: 0.85rem;
            color: #64748b;
        }
        .vote-link {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }
        .vote-link:hover {
            text-decoration: underline;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }
        .back-btn:hover {
            text-decoration: underline;
        }
        .vote-badge {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .badge-pour {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
        .badge-contre {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        .badge-abstention {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🏛️ Observatoire du Libéralisme</h1>
            <p>Fiche d'évaluation individuelle du député</p>
        </div>
    </header>

    <main class="container">
        <a href="index.html" class="back-btn">← Retour au classement général</a>

        <div id="depute-content" class="card">
            <p>Chargement des données du député...</p>
        </div>
    </main>

    <script>
        const PILLARS_MAP = {
            FIS: { label: "Santé Fiscale & Impôts", desc: "Modération fiscale et attractivité" },
            ETA: { label: "Taille de l'État & Dépenses", desc: "Maîtrise des dépenses publiques" },
            REG: { label: "Fardeau Réglementaire", desc: "Simplification et liberté des affaires" },
            PRO: { label: "Droit de Propriété", desc: "Protection du capital et du patrimoine" },
            LIB: { label: "Liberté du Travail", desc: "Flexibilité et liberté d'embauche" },
            OUV: { label: "Ouverture des Marchés", desc: "Libre-échange et concurrence" }
        };

        const SOCIAL_NAMES = {
            x: "X (Twitter)",
            facebook: "Facebook",
            linkedin: "LinkedIn",
            instagram: "Instagram"
        };

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        }

        function getBande(score) {
            if (score >= 80) return { label: "Libéral", class: "bande-liberal", color: "#16a34a" };
            if (score >= 70) return { label: "Plutôt libéral", class: "bande-plutot", color: "#0284c7" };
            if (score >= 60) return { label: "Modérément libéral", class: "bande-modere", color: "#ca8a04" };
            if (score >= 50) return { label: "Peu libéral", class: "bande-peu", color: "#ea580c" };
            return { label: "Dirigiste", class: "bande-dirigiste", color: "#dc2626" };
        }

        const params = new URLSearchParams(window.location.search);
        const deputeId = params.get('id');

        if (!deputeId) {
            document.getElementById('depute-content').innerHTML = `
                <p style="color: red; font-weight: bold;">Erreur : Aucun identifiant de député spécifié.</p>
            `;
        } else {
            fetch('./data.json?t=' + Date.now())
                .then(res => {
                    if (!res.ok) throw new Error("Impossible de charger data.json");
                    return res.json();
                })
                .then(deputes => {
                    const d = deputes.find(item => String(item.id).toLowerCase() === String(deputeId).toLowerCase());

                    if (!d) {
                        document.getElementById('depute-content').innerHTML = `
                            <p style="color: red; font-weight: bold;">Député introuvable dans la base de données.</p>
                        `;
                        return;
                    }

                    const scoreGlobal = d.score_global !== undefined
                        ? d.score_global
                        : (Object.values(d.scores || {}).length ? Math.round(Object.values(d.scores).reduce((a, b) => a + b, 0) / Object.values(d.scores).length) : 0);

                    const bande = getBande(scoreGlobal);
                    const photoUrl = d.photoUrl || d.photo || d.avatar || `https://www.assemblee-nationale.fr/17/photos/${d.id}.jpg`;
                    const nomFamille = d.nom.split(' ').pop();
                    const scores = d.scores || {};

                    // Mettre à jour les métadonnées Open Graph
                    const pageTitle = `${d.nom} (${scoreGlobal}/100 - ${bande.label}) | Observatoire du Libéralisme`;
                    const pageDesc = `Consultez le score libéral de ${d.nom} (${d.circo}) calculé selon les 6 piliers de la liberté économique.`;

                    document.title = pageTitle;
                    document.getElementById('og-title').setAttribute('content', pageTitle);
                    document.getElementById('og-desc').setAttribute('content', pageDesc);
                    document.getElementById('og-image').setAttribute('content', photoUrl);
                    document.getElementById('og-url').setAttribute('content', window.location.href);

                    document.getElementById('tw-title').setAttribute('content', pageTitle);
                    document.getElementById('tw-desc').setAttribute('content', pageDesc);
                    document.getElementById('tw-image').setAttribute('content', photoUrl);

                    // Génération de la Carte FUT
                    const futCardHtml = `
                        <div class="fut-card-large">
                            <div class="fut-header">
                                <div class="fut-badge">
                                    <div class="fut-score-global">${scoreGlobal}</div>
                                    <div class="fut-groupe">${d.groupe || 'UDR'}</div>
                                </div>
                                <div class="fut-photo-container">
                                    <img src="${photoUrl}" alt="${d.nom}" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='https://www.assemblee-nationale.fr/17/photos/${d.id}.jpg';">
                                </div>
                            </div>
                            <div class="fut-nom">${nomFamille}</div>
                            <div class="fut-stats">
                                <div class="fut-stat"><span class="fut-stat-val">${scores.FIS ?? 0}</span><span class="fut-stat-lbl">FIS</span></div>
                                <div class="fut-stat"><span class="fut-stat-val">${scores.PRO ?? 0}</span><span class="fut-stat-lbl">PRO</span></div>
                                <div class="fut-stat"><span class="fut-stat-val">${scores.ETA ?? 0}</span><span class="fut-stat-lbl">ETA</span></div>
                                <div class="fut-stat"><span class="fut-stat-val">${scores.LIB ?? 0}</span><span class="fut-stat-lbl">LIB</span></div>
                                <div class="fut-stat"><span class="fut-stat-val">${scores.REG ?? 0}</span><span class="fut-stat-lbl">REG</span></div>
                                <div class="fut-stat"><span class="fut-stat-val">${scores.OUV ?? 0}</span><span class="fut-stat-lbl">OUV</span></div>
                            </div>
                        </div>
                    `;

                    // Traitement des réseaux sociaux et contacts
                    let totalAbonnes = 0;
                    let hasAbonnes = false;
                    let socialBadgesHtml = '';

                    if (d.email) {
                        socialBadgesHtml += `
                            <a href="mailto:${d.email}" class="social-badge">
                                ✉️ Email : <strong>${d.email}</strong>
                            </a>
                        `;
                    }

                    if (d.reseaux) {
                        for (const [key, net] of Object.entries(d.reseaux)) {
                            let url = "";
                            let abonnees = 0;

                            if (typeof net === 'string') {
                                url = net;
                            } else if (net && typeof net === 'object') {
                                url = net.url || "";
                                abonnees = net.abonnees || 0;
                            }

                            if (url) {
                                const name = SOCIAL_NAMES[key.toLowerCase()] || key;
                                if (abonnees > 0) {
                                    totalAbonnes += abonnees;
                                    hasAbonnes = true;
                                    socialBadgesHtml += `
                                        <a href="${url}" target="_blank" rel="noopener" class="social-badge">
                                            🌐 ${name} : <strong>${formatNumber(abonnees)}</strong> abonnés ↗
                                        </a>
                                    `;
                                } else {
                                    socialBadgesHtml += `
                                        <a href="${url}" target="_blank" rel="noopener" class="social-badge">
                                            🌐 ${name} ↗
                                        </a>
                                    `;
                                }
                            }
                        }
                    }

                    const socialTotalHtml = hasAbonnes ? `<div class="social-total">📢 Audience cumulée : ${formatNumber(totalAbonnes)} abonnés</div>` : '';

                    const socialSectionHtml = socialBadgesHtml ? `
                        <div class="social-box">
                            ${socialTotalHtml}
                            <div class="social-links">
                                ${socialBadgesHtml}
                            </div>
                        </div>
                    ` : '';

                    // Biographie Wikipédia
                    const bioSectionHtml = d.biographie ? `
                        <div class="social-box" style="margin-top: 15px;">
                            <h3 style="margin: 0 0 8px 0; font-size: 1.1rem; color: #1e293b;">📝 Biographie</h3>
                            <p style="color: #475569; line-height: 1.5; margin: 0; font-size: 0.95rem;">${d.biographie}</p>
                        </div>
                    ` : '';

                    // Synthèse IA Gemini
                    const syntheseHtml = d.synthese_analyse ? `
                        <div class="social-box" style="margin-top: 15px; background-color: #fffbeb; border: 1px solid #fcd34d;">
                            <h3 style="margin: 0 0 8px 0; font-size: 1.1rem; color: #b45309;">💡 Analyse du profil économique (IA)</h3>
                            <p style="color: #78350f; line-height: 1.5; margin: 0; font-size: 0.95rem;">${d.synthese_analyse}</p>
                        </div>
                    ` : '';

                    const datanBtnHtml = d.datanUrl
                        ? `<a href="${d.datanUrl}" target="_blank" rel="noopener" class="datan-link">📊 Profil Datan.fr ↗</a>`
                        : '';

                    // Stats d'activité Datan
                    const statsHtml = (d.stats && (d.stats.participation || d.stats.loyaute_groupe)) ? `
                        <div class="stats-grid">
                            ${d.stats.participation ? `
                                <div class="stat-card">
                                    <span class="stat-value">${d.stats.participation}%</span>
                                    <span class="stat-label">Participation aux votes</span>
                                </div>
                            ` : ''}
                            ${d.stats.loyaute_groupe ? `
                                <div class="stat-card">
                                    <span class="stat-value">${d.stats.loyaute_groupe}%</span>
                                    <span class="stat-label">Proximité avec son groupe</span>
                                </div>
                            ` : ''}
                        </div>
                    ` : '';

                    // Profession
                    const professionHtml = d.profession ? `
                        <p style="margin-top: 6px; font-size: 0.95rem;">
                            💼 <strong>Profession :</strong> ${d.profession}
                        </p>
                    ` : '';

                    // Cartes des piliers
                    let pillarsHtml = '';
                    for (const [code, info] of Object.entries(PILLARS_MAP)) {
                        const score = (d.scores && d.scores[code] !== undefined) ? d.scores[code] : 0;
                        const pBande = getBande(score);

                        pillarsHtml += `
                            <div class="pillar-card">
                                <div class="pillar-title">
                                    <span>${info.label}</span>
                                    <span><strong>${score}</strong> / 100</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width: ${score}%; background-color: ${pBande.color};"></div>
                                </div>
                                <small style="color: #64748b; margin-top: 6px; display: block;">${info.desc}</small>
                            </div>
                        `;
                    }

                    // Votes enregistrés
                    let votesHtml = '';
                    const listVotes = d.votes || d.initiatives || [];

                    if (listVotes.length > 0) {
                        votesHtml = listVotes.map(vote => {
                            let badgeClass = 'badge-abstention';
                            if (vote.position === 'POUR') badgeClass = 'badge-pour';
                            if (vote.position === 'CONTRE') badgeClass = 'badge-contre';

                            return `
                                <div class="initiative-card">
                                    <div class="initiative-header">
                                        <span class="initiative-title">${vote.titre}</span>
                                        <div style="display: flex; align-items: center; gap: 8px;">
                                            <span class="initiative-meta">📅 ${vote.date || 'Récents'}</span>
                                            ${vote.position ? `<span class="vote-badge ${badgeClass}">${vote.position}</span>` : ''}
                                        </div>
                                    </div>
                                    ${vote.description ? `<p style="margin: 6px 0 0 0; color: #475569; font-size: 0.95rem;">${vote.description}</p>` : ''}
                                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-top: 8px;">
                                        ${vote.pilier && PILLARS_MAP[vote.pilier] ? `<small style="color: #2563eb; font-weight: bold;">Pilier concerné : ${PILLARS_MAP[vote.pilier].label}</small>` : '<span></span>'}
                                        ${vote.url ? `<a href="${vote.url}" target="_blank" rel="noopener" class="vote-link">Voir le vote sur Datan.fr ↗</a>` : ''}
                                    </div>
                                </div>
                            `;
                        }).join('');
                    } else {
                        votesHtml = '<p style="color: #64748b; font-style: italic;">Aucun vote répertorié pour le moment.</p>';
                    }

                    // Assemblage final du contenu HTML
                    document.getElementById('depute-content').innerHTML = `
                        <div class="profile-header">
                            ${futCardHtml}
                            <div class="profile-info">
                                <h2>${d.nom}</h2>
                                <p><strong>Groupe :</strong> ${d.groupe || 'UDR'} | <strong>Circonscription :</strong> ${d.circo}</p>
                                ${professionHtml}

                                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px;">
                                    <span class="badge ${bande.class}" style="font-size: 0.95rem; padding: 6px 12px;">
                                        ${d.qualification || bande.label} — ${scoreGlobal} / 100
                                    </span>
                                    ${datanBtnHtml}
                                </div>

                                ${statsHtml}
                            </div>
                        </div>

                        ${socialSectionHtml}

                        ${bioSectionHtml}

                        ${syntheseHtml}

                        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">

                        <h3>📊 Décomposition selon les 6 piliers économiques</h3>
                        <div class="pillar-grid">
                            ${pillarsHtml}
                        </div>

                        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 25px 0;">

                        <h3>📜 Votes enregistrés (${listVotes.length})</h3>
                        <div style="margin-top: 10px;">
                            ${votesHtml}
                        </div>
                    `;
                })
                .catch(err => {
                    document.getElementById('depute-content').innerHTML = `
                        <p style="color: red; font-weight: bold;">Erreur : ${err.message}</p>
                    `;
                });
        }
    </script>
</body>
</html>
