<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche Député - Observatoire du Libéralisme</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🏛️ Observatoire du Libéralisme</h1>
            <p><a href="index.html" style="color: white;">← Retour au classement général</a></p>
        </div>
    </header>

    <main class="container">
        <div class="card" id="fiche">
            <p>Chargement de la fiche...</p>
        </div>
    </main>

    <script>
        function getBande(score) {
            if (score >= 80) return { label: "Libéral", class: "bande-liberal" };
            if (score >= 70) return { label: "Plutôt libéral", class: "bande-plutot" };
            if (score >= 60) return { label: "Modérément libéral", class: "bande-modere" };
            if (score >= 50) return { label: "Peu libéral", class: "bande-peu" };
            return { label: "Dirigiste", class: "bande-dirigiste" };
        }

        const id = new URLSearchParams(window.location.search).get('id');
        const card = document.getElementById('fiche');

        if (!id) {
            card.innerHTML = '<p style="color:red;">Aucun député sélectionné.</p>';
        } else {
            fetch('./data.json?t=' + Date.now())
                .then(res => {
                    if (!res.ok) throw new Error("Impossible de lire data.json");
                    return res.json();
                })
                .then(deputes => {
                    const d = deputes.find(item => item.id === id);
                    if (!d) {
                        card.innerHTML = '<p style="color:red;">Député introuvable.</p>';
                        return;
                    }

                    const vals = Object.values(d.scores || {});
                    const scoreGlobal = vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
                    const bande = getBande(scoreGlobal);

                    card.innerHTML = `
                        <h2>${d.nom}</h2>
                        <p style="color: #64748b;"><strong>Circonscription :</strong> ${d.circo}</p>

                        <div style="margin: 20px 0;">
                            <span style="font-size: 1.5rem; font-weight: bold;">Score global : ${scoreGlobal} / 100</span>
                            <span class="badge ${bande.class}" style="margin-left: 15px;">${bande.label}</span>
                        </div>

                        <h3>Biographie</h3>
                        <p style="line-height: 1.6;">${d.bio}</p>

                        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">

                        <h3>Détail des 6 piliers</h3>
                        <ul>
                            <li><strong>Fiscalité (FIS) :</strong> ${d.scores.FIS} / 100</li>
                            <li><strong>Périmètre de l'État (ÉTA) :</strong> ${d.scores.ETA} / 100</li>
                            <li><strong>Régulation (RÉG) :</strong> ${d.scores.REG} / 100</li>
                            <li><strong>Propriété (PRO) :</strong> ${d.scores.PRO} / 100</li>
                            <li><strong>Libertés individuelles (LIB) :</strong> ${d.scores.LIB} / 100</li>
                            <li><strong>Ouverture des marchés (OUV) :</strong> ${d.scores.OUV} / 100</li>
                        </ul>
                    `;
                })
                .catch(err => {
                    card.innerHTML = `<p style="color:red;">Erreur : ${err.message}</p>`;
                });
        }
    </script>
</body>
</html>
